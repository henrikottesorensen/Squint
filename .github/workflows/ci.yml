name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for MinVer

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Three operating systems, deliberately: the suite compares the library's normaliser
      # against the runtime's, which is a different ICU on each of them (and NLS on Windows if
      # asked), so a runner-specific disagreement is exactly the kind of drift the library
      # exists to remove. The ICU 78.3 oracle fixtures are committed and need no ICU to run.
      - name: Test
        if: runner.os != 'Linux'
        run: dotnet test -c Release

      # Coverage on the one runner whose profiler supports it; macOS arm64 does not
      # initialise the collector, and one report is enough.
      - name: Test with coverage
        if: runner.os == 'Linux'
        run: |
          dotnet tool install --global dotnet-coverage
          dotnet-coverage collect -f cobertura -o coverage.cobertura.xml "dotnet test -c Release"

      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.cobertura.xml

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for MinVer

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: dotnet pack Squint/Squint.csproj -c Release -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/*.nupkg
